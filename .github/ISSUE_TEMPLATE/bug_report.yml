name: Bug report
description: Something in the dock, the bridge script, the installer or an update does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. English or Russian is fine.
        Do not paste your obs-websocket password or stream key: the diagnostics below never contain them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a stream with obs-multi-rtmp targets
        2. Switch the scene collection
        3. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In the dock: Settings → Diagnostics → Copy diagnostics, then paste here.
        If the dock shows an error screen, paste the error report from it instead.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the dock was installed
      options:
        - Installer
        - Zip archive
        - Built from source
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the journal (Settings → Diagnostics → Open journal folder, or %LOCALAPPDATA%\streamoscope\logs), the installer log (%LOCALAPPDATA%\streamoscope\configure-obs.log; your Windows user folder is already hidden there, but it lists the names of your scene collections and profiles, so edit them out if they are private), other plugins you use.
