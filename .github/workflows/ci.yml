name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run package:release

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/buildInstaller/fetchMinisign.ts

      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Test the OBS setup script
        shell: powershell
        run: ./installer/tests/run-tests.ps1

      - uses: actions/cache@v6
        with:
          path: .test-stand/downloads
          key: obs-archive-${{ hashFiles('scripts/testStand/consts.ts') }}

      - run: node scripts/testStand/fetchLua.ts

      - name: Test the bridge
        shell: powershell
        run: ./obs-script/tests/run-tests.ps1
